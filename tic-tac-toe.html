<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #334155;
      --accent-x: #f43f5e;
      --accent-o: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #475569;
      --radius: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--accent-x), var(--accent-o));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Scoreboard */
    .scoreboard {
      display: flex;
      width: 100%;
      gap: 0.75rem;
    }

    .score-card {
      flex: 1;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      text-align: center;
      border: 2px solid transparent;
      transition: border-color 0.2s, transform 0.15s;
    }

    .score-card.active-x { border-color: var(--accent-x); transform: translateY(-2px); }
    .score-card.active-o { border-color: var(--accent-o); transform: translateY(-2px); }

    .score-card .player-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .score-card.x .player-label { color: var(--accent-x); }
    .score-card.o .player-label { color: var(--accent-o); }

    .score-card .player-symbol {
      font-size: 1.5rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .score-card.x .player-symbol { color: var(--accent-x); }
    .score-card.o .player-symbol { color: var(--accent-o); }

    .score-card .player-score {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
    }

    .score-card-draw {
      flex: 0.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 0.85rem 0.5rem;
      text-align: center;
    }

    .score-card-draw .player-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .score-card-draw .player-score {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--muted);
    }

    /* Status */
    .status {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--muted);
      height: 1.5rem;
      text-align: center;
      transition: color 0.2s;
    }

    .status.x { color: var(--accent-x); }
    .status.o { color: var(--accent-o); }
    .status.draw { color: var(--text); }

    /* Board */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .cell {
      aspect-ratio: 1;
      background: var(--surface);
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-size: 3rem;
      font-weight: 900;
      color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }

    .cell:hover:not(.taken):not(.game-over) {
      background: var(--surface2);
      transform: scale(0.97);
    }

    .cell:active:not(.taken):not(.game-over) {
      transform: scale(0.93);
    }

    .cell.x {
      color: var(--accent-x);
    }

    .cell.o {
      color: var(--accent-o);
    }

    .cell.win {
      background: var(--surface2);
      animation: pulse 0.5s ease-out;
    }

    .cell.win.x { box-shadow: inset 0 0 0 3px var(--accent-x); }
    .cell.win.o { box-shadow: inset 0 0 0 3px var(--accent-o); }

    @keyframes pulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes pop-in {
      0%   { transform: scale(0.3); opacity: 0; }
      60%  { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    .cell .mark {
      display: inline-block;
      animation: pop-in 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    /* Buttons */
    .btn {
      padding: 0.65rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-x), var(--accent-o));
      color: #fff;
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.4rem 1rem;
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    /* Mode selector */
    .mode-bar {
      display: flex;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 4px;
      gap: 4px;
    }

    .mode-btn {
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      transition: background 0.15s, color 0.15s;
    }

    .mode-btn.active {
      background: var(--surface2);
      color: var(--text);
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Tic-Tac-Toe</h1>

  <div class="mode-bar">
    <button class="mode-btn active" id="mode-2p">2 Players</button>
    <button class="mode-btn" id="mode-ai">vs Computer</button>
  </div>

  <div class="scoreboard">
    <div class="score-card x active-x" id="card-x">
      <div class="player-label" id="label-x">Player X</div>
      <div class="player-symbol">✕</div>
      <div class="player-score" id="score-x">0</div>
    </div>
    <div class="score-card-draw">
      <div class="player-label">Draws</div>
      <div class="player-score" id="score-d">0</div>
    </div>
    <div class="score-card o" id="card-o">
      <div class="player-label" id="label-o">Player O</div>
      <div class="player-symbol">○</div>
      <div class="player-score" id="score-o">0</div>
    </div>
  </div>

  <div class="status x" id="status">Player X's turn</div>

  <div class="board" id="board">
    <button class="cell" data-idx="0"></button>
    <button class="cell" data-idx="1"></button>
    <button class="cell" data-idx="2"></button>
    <button class="cell" data-idx="3"></button>
    <button class="cell" data-idx="4"></button>
    <button class="cell" data-idx="5"></button>
    <button class="cell" data-idx="6"></button>
    <button class="cell" data-idx="7"></button>
    <button class="cell" data-idx="8"></button>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="new-game-btn">New Game</button>
    <button class="btn btn-ghost" id="reset-scores-btn">Reset Scores</button>
  </div>
</div>

<script>
  const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  let board = Array(9).fill(null);
  let currentPlayer = 'X';
  let gameOver = false;
  let scores = { X: 0, O: 0, D: 0 };
  let vsAI = false;

  const cells = Array.from(document.querySelectorAll('.cell'));
  const statusEl = document.getElementById('status');
  const scoreX = document.getElementById('score-x');
  const scoreO = document.getElementById('score-o');
  const scoreD = document.getElementById('score-d');
  const cardX = document.getElementById('card-x');
  const cardO = document.getElementById('card-o');
  const labelX = document.getElementById('label-x');
  const labelO = document.getElementById('label-o');
  const mode2p = document.getElementById('mode-2p');
  const modeAI = document.getElementById('mode-ai');

  function checkWinner(b) {
    for (const [a, c, d] of WINS) {
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return { winner: b[a], line: [a, c, d] };
    }
    if (b.every(Boolean)) return { winner: null, line: null, draw: true };
    return null;
  }

  function minimax(b, isMax) {
    const res = checkWinner(b);
    if (res) {
      if (res.draw) return 0;
      return res.winner === 'O' ? 10 : -10;
    }
    const scores = b.map((v, i) => {
      if (v) return null;
      const nb = [...b];
      nb[i] = isMax ? 'O' : 'X';
      return minimax(nb, !isMax);
    });
    return isMax
      ? Math.max(...scores.filter(s => s !== null))
      : Math.min(...scores.filter(s => s !== null));
  }

  function bestMove(b) {
    let best = -Infinity, move = -1;
    b.forEach((v, i) => {
      if (v) return;
      const nb = [...b];
      nb[i] = 'O';
      const s = minimax(nb, false);
      if (s > best) { best = s; move = i; }
    });
    return move;
  }

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = 'status ' + (cls || '');
  }

  function updateTurnHighlight() {
    cardX.className = 'score-card x' + (currentPlayer === 'X' && !gameOver ? ' active-x' : '');
    cardO.className = 'score-card o' + (currentPlayer === 'O' && !gameOver ? ' active-o' : '');
  }

  function render() {
    cells.forEach((cell, i) => {
      const val = board[i];
      cell.innerHTML = val ? `<span class="mark">${val === 'X' ? '✕' : '○'}</span>` : '';
      cell.className = 'cell' + (val ? ' ' + val.toLowerCase() + ' taken' : '') + (gameOver ? ' game-over' : '');
    });
    scoreX.textContent = scores.X;
    scoreO.textContent = scores.O;
    scoreD.textContent = scores.D;
    updateTurnHighlight();
  }

  function handleClick(idx) {
    if (gameOver || board[idx]) return;

    board[idx] = currentPlayer;
    render();

    const result = checkWinner(board);
    if (result) {
      endGame(result);
      return;
    }

    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    const label = vsAI && currentPlayer === 'O' ? 'Computer' : `Player ${currentPlayer}`;
    setStatus(`${label}'s turn`, currentPlayer.toLowerCase());
    updateTurnHighlight();

    if (vsAI && currentPlayer === 'O' && !gameOver) {
      setTimeout(aiMove, 400);
    }
  }

  function aiMove() {
    const move = bestMove(board);
    if (move === -1) return;
    board[move] = 'O';
    render();

    const result = checkWinner(board);
    if (result) {
      endGame(result);
      return;
    }

    currentPlayer = 'X';
    setStatus("Player X's turn", 'x');
    updateTurnHighlight();
  }

  function endGame(result) {
    gameOver = true;
    cells.forEach(c => c.classList.add('game-over'));

    if (result.draw) {
      scores.D++;
      setStatus("It's a draw!", 'draw');
      cardX.className = 'score-card x';
      cardO.className = 'score-card o';
    } else {
      scores[result.winner]++;
      result.line.forEach(i => cells[i].classList.add('win'));
      const winnerLabel = vsAI && result.winner === 'O' ? 'Computer' : `Player ${result.winner}`;
      setStatus(`${winnerLabel} wins!`, result.winner.toLowerCase());
    }

    scoreX.textContent = scores.X;
    scoreO.textContent = scores.O;
    scoreD.textContent = scores.D;
  }

  function newGame() {
    board = Array(9).fill(null);
    currentPlayer = 'X';
    gameOver = false;
    setStatus("Player X's turn", 'x');
    render();
  }

  document.getElementById('board').addEventListener('click', e => {
    const cell = e.target.closest('.cell');
    if (cell) handleClick(Number(cell.dataset.idx));
  });

  document.getElementById('new-game-btn').addEventListener('click', newGame);

  document.getElementById('reset-scores-btn').addEventListener('click', () => {
    scores = { X: 0, O: 0, D: 0 };
    newGame();
  });

  mode2p.addEventListener('click', () => {
    vsAI = false;
    mode2p.classList.add('active');
    modeAI.classList.remove('active');
    labelX.textContent = 'Player X';
    labelO.textContent = 'Player O';
    newGame();
  });

  modeAI.addEventListener('click', () => {
    vsAI = true;
    modeAI.classList.add('active');
    mode2p.classList.remove('active');
    labelX.textContent = 'You (X)';
    labelO.textContent = 'Computer';
    newGame();
  });

  render();
</script>
</body>
</html>
